[project]
name = "drtm-tests"
version = "0.1.0"
description = "Boots TrenchBoot images under a QEMU that runs SKINIT, and the harness drtm shares"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
    "pytest",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
tb-boot = "drtmtest.boot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drtmtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Backstop for hangs the harness's own timeouts do not cover. Must stay
# above BOOT_TIMEOUT in tests/conftest.py, so a slow boot fails on that
# timeout, which reports the serial output so far, rather than on this one.
#
# "signal" rather than "thread": it raises inside the test, so pytest still
# reports the failure and runs pytest_sessionfinish, which writes
# results.txt.
timeout = 900
timeout_method = "signal"
